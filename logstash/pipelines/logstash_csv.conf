input {
  file {
    path => "/etl/events_raw.csv"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "plain"
    type => "csv_data"
  }
}

filter {
  # Filtrar líneas vacías y headers
  if [message] =~ /^uuid,type,location/ or [message] == "" or ![message] {
    drop { }
  }
  
  # Parsear CSV con manejo de errores
  csv {
    columns => [
      "uuid", "event_type", "location", "location_desc", "description",
      "timestamp", "source", "length_meters", "speed",
      "congestion_level", "delay_seconds", "waze_id"
    ]
    separator => ","
    skip_empty_columns => true
  }
  
  # Validar que tenemos datos mínimos requeridos
  if ![uuid] or ![event_type] or ![timestamp] {
    drop { }
  }
  
  mutate {
    rename => { "event_type" => "incident_type" }
  }
  
  # Procesar timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Extraer información temporal 
  ruby {
    code => '
      begin
        if event.get("@timestamp")
          timestamp = event.get("@timestamp").time
          event.set("hour", timestamp.hour)
          event.set("day_of_week", timestamp.wday)
          event.set("is_weekend", [0, 6].include?(timestamp.wday))
          event.set("is_peak_hour", [21, 22, 23].include?(timestamp.hour))
        end
      rescue => e
        event.tag("_ruby_error")
        event.set("ruby_error", e.message)
      end
    '
  }
  
  # Convertir tipos de datos con validación
  if [length_meters] and [length_meters] != "" {
    mutate {
      convert => { "length_meters" => "integer" }
    }
  }
  
  if [speed] and [speed] != "" {
    mutate {
      convert => { "speed" => "float" }
    }
  }
  
  if [congestion_level] and [congestion_level] != "" {
    mutate {
      convert => { "congestion_level" => "integer" }
    }
  }
  
  if [delay_seconds] and [delay_seconds] != "" {
    mutate {
      convert => { "delay_seconds" => "integer" }
    }
  }
  
  if [hour] {
    mutate {
      convert => { "hour" => "integer" }
    }
  }
  
  if [day_of_week] {
    mutate {
      convert => { "day_of_week" => "integer" }
    }
  }
  
  # Limpiar campos vacíos
  if [description] == "" {
    mutate { remove_field => ["description"] }
  }
  
  if [location_desc] == "" {
    mutate { remove_field => ["location_desc"] }
  }
  
  # Agregar metadatos
  mutate {
    add_field => { "data_source" => "csv_data" }
    remove_field => ["message", "path", "host"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "traffic-events-processed-%{+YYYY.MM.dd}"
    action => "index"
    template_name => "traffic-events"
    document_id => "%{uuid}"
    template_overwrite => true
  }
  
  # Solo mostrar errores y datos de debugging
  if "_csvparsefailure" in [tags] or "_ruby_error" in [tags] or "_mutate_error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}