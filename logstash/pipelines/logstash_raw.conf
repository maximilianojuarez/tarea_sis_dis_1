input {
  mongodb {
    uri => "mongodb://mongodb:27017/traffic_db"
    placeholder_db_dir => "/tmp/logstash/"
    placeholder_db_name => "logstash_mongo.db"
    collection => "events"
    batch_size => 1000
    type => "mongo_data"
  }
}

filter {
  # Renombrar campos básicos
  mutate {
    rename => {
      "_id" => "mongo_id"
      "type" => "incident_type"
    }
  }
  
  # Procesar timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Extraer información temporal
  ruby {
    code => '
      begin
        if event.get("@timestamp")
          timestamp = event.get("@timestamp").time
          event.set("hour", timestamp.hour)
          event.set("day_of_week", timestamp.wday)
          event.set("is_weekend", [0, 6].include?(timestamp.wday))
          event.set("is_peak_hour", [7, 8, 9, 17, 18, 19].include?(timestamp.hour))
        end
      rescue => e
        event.tag("_ruby_error")
        event.set("ruby_error", e.message)
      end
    '
  }
  
  # Convertir tipos de datos
  if [length_meters] {
    mutate {
      convert => { "length_meters" => "integer" }
    }
  }
  
  if [speed] {
    mutate {
      convert => { "speed" => "float" }
    }
  }
  
  if [congestion_level] {
    mutate {
      convert => { "congestion_level" => "integer" }
    }
  }
  
  if [delay_seconds] {
    mutate {
      convert => { "delay_seconds" => "integer" }
    }
  }
  
  if [hour] {
    mutate {
      convert => { "hour" => "integer" }
    }
  }
  
  if [day_of_week] {
    mutate {
      convert => { "day_of_week" => "integer" }
    }
  }
  
  # Remover campos vacíos
  if [description] == "" {
    mutate { 
      remove_field => ["description"] 
    }
  }
  
  # Agregar campo de origen
  mutate {
    add_field => { "data_source" => "mongo_data" }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "traffic-events-raw-%{+YYYY.MM.dd}"
    action => "index"
    template_name => "traffic-events"
    document_id => "%{mongo_id}"
    template_overwrite => true
  }
  
  # Solo mostrar errores en stdout para debugging
  if "_mutate_error" in [tags] or "_ruby_error" in [tags] {
    stdout {
      codec => rubydebug
    }
  }
}